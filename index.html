<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff2e93">
<title>Chamô Admin — painel de controle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pk:#ff2e93;--pk2:#ff6db5;--pk3:#ffe3f1;--bg:#ffffff;--card:#fff6fb;--ink:#1b0c17;--ink2:#6b5563;--line:#f4dcea;--gr:#12b76a;--gr2:#0e9f5c;--red:#e5484d;--amb:#f59e0b;--shadow:0 12px 40px rgba(255,46,147,.18);
--f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150911;--card:#22101c;--ink:#fff1f8;--ink2:#c9a9bc;--line:#3a1c30;--pk3:#3a1230}}
:root[data-theme="dark"]{--bg:#150911;--card:#22101c;--ink:#fff1f8;--ink2:#c9a9bc;--line:#3a1c30;--pk3:#3a1230}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;font-family:var(--f);background:#0d0509;color:var(--ink);overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.hide{display:none!important}
#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;background:var(--bg);overflow:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.scr.nonav{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.page{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 8px}
.row{display:flex;align-items:center}.g8{gap:8px}.g12{gap:12px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.mut{color:var(--ink2)}.big{font-size:20px;font-weight:800;letter-spacing:-.01em}small{font-size:12.5px}
h1,h2,h3{margin:0;letter-spacing:-.02em}h2{font-size:26px;line-height:1.12;font-weight:800}h3{font-size:19px;font-weight:800}
p{margin:6px 0}
.av{border-radius:50%;background:linear-gradient(135deg,var(--pk),var(--pk2));color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:18px;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,#ff2e93,#ff5fae);box-shadow:0 10px 26px rgba(255,46,147,.38);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.green{background:linear-gradient(135deg,#12b76a,#0e9f5c);box-shadow:0 10px 26px rgba(18,183,106,.4)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.btn.red{background:none;color:var(--red);box-shadow:none;border:1.5px solid var(--red)}
.btn.sm{height:42px;font-size:14.5px;border-radius:14px;width:auto;padding:0 16px}
.btn[disabled]{opacity:.5;pointer-events:none}
.splash{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,#ff2e93 0%,#b3125f 38%,#2a0c20 78%);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:calc(56px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));overflow:auto}
.brand{text-align:center}.brand .logo{width:86px;height:86px;margin:0 auto 14px;border-radius:28px;background:#fff;display:grid;place-items:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.brand h1{font-size:44px;font-weight:800;letter-spacing:-.04em}.brand p{opacity:.92;font-size:16px}
.roles{display:grid;gap:12px;margin-top:28px}
.role{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto;column-gap:14px;align-items:center;text-align:left;color:#fff;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);border-radius:22px;padding:14px 16px;transition:transform .12s}
.role:active{transform:scale(.98)}.role .ri{grid-row:1/3;font-size:32px;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.role b{font-size:18px}.role small{opacity:.85}.role.dim{opacity:.6}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.gps{font-size:12px;font-weight:700;padding:7px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.gps.ok{color:var(--gr2)}.gps.denied,.gps.off{color:var(--red)}.gps.wait{color:var(--amb)}
.hero h2{margin-bottom:14px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:0 14px;height:54px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;padding:12px 6px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;text-align:center;transition:transform .12s,border-color .12s}
.tile:active{transform:scale(.95);border-color:var(--pk)}.tile .te{font-size:31px;line-height:1}.tile .tn{font-size:12.5px;font-weight:700;line-height:1.2}
.live{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:16px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,#ff2e93,#ff5fae);color:#fff;box-shadow:var(--shadow)}
.live b{display:block}.live .dot{width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--ink2);border-radius:14px}
.nav button span{font-size:22px;filter:grayscale(1);opacity:.7}.nav button.on{color:var(--pk)}.nav button.on span{filter:none;opacity:1}
.ov{position:absolute;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.ovh{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px}
.ovh .x{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px}
.ovb{flex:1;overflow:auto;padding:4px 16px 16px}
.ovf{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 14px;margin-bottom:10px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);transition:border-color .12s,background .12s}
.opt .ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:800;flex:none}
.opt.on{border-color:var(--pk);background:var(--pk3)}.opt.on .ck{background:var(--pk);border-color:var(--pk);color:#fff}
.opt b{font-weight:700}.opt .pr{font-weight:800;color:var(--pk);white-space:nowrap}
.sum{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:6px 16px}
.sum .l{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}.sum .l:last-child{border:0}
.total{font-size:40px;font-weight:800;letter-spacing:-.03em;color:var(--gr2);text-align:center;margin:18px 0 6px}
.field{display:block;margin-bottom:14px}.field>span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pk)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600}
.chip.on{background:var(--pk);border-color:var(--pk);color:#fff}
.avup{display:block;width:104px;height:104px;margin:6px auto 18px;position:relative;cursor:pointer}
.avup .av{width:104px;height:104px;font-size:38px;border:3px solid var(--pk3)}
.avup i{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--pk);color:#fff;display:grid;place-items:center;font-style:normal;border:3px solid var(--bg)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--pk3);color:var(--pk)}
.pill.g{background:rgba(18,183,106,.14);color:var(--gr2)}.pill.r{background:rgba(229,72,77,.14);color:var(--red)}.pill.a{background:rgba(245,158,11,.16);color:#b45309}
.mapbox{position:absolute;inset:0;background:#1a0b16}.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#mtop{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
#mtop>*{pointer-events:auto}
.fab{width:46px;height:46px;border-radius:50%;background:var(--bg);color:var(--ink);font-size:19px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.tag{display:flex;align-items:center;gap:8px;background:var(--bg);padding:8px 14px 8px 8px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-weight:800;font-size:14px}
#mfab{position:absolute;left:0;right:0;top:calc(76px + env(safe-area-inset-top,0px));display:flex;justify-content:center;pointer-events:none;z-index:4}
.schip{background:rgba(27,12,23,.88);color:#fff;border:1px solid rgba(255,46,147,.6);padding:10px 18px;border-radius:99px;font-weight:800;font-size:15px;box-shadow:0 0 30px rgba(255,46,147,.5);backdrop-filter:blur(8px)}
.schip:after{content:'';display:inline-block;width:1.2em;text-align:left;animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
#panel{position:absolute;left:0;right:0;bottom:0;z-index:6}
#panel.nv{bottom:calc(62px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -16px 50px rgba(0,0,0,.4);animation:up .28s ease-out}
#panel.nv .sheet{border-radius:28px;margin:0 10px;padding-bottom:18px}
.sheet .btn{margin-top:12px}
.bar{height:5px;border-radius:9px;background:var(--pk3);overflow:hidden;margin:2px 0 14px}.bar:after{content:'';display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--pk),var(--pk2));border-radius:9px;animation:slide 1.3s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.acts{display:flex;gap:10px;margin-top:12px}.acts .btn{margin:0;flex:1}
.ib{position:relative;width:54px;height:54px;border-radius:18px;background:var(--pk3);font-size:22px;flex:none;display:grid;place-items:center}
.ib i{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:11px;font-style:normal;font-weight:800;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 5px}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.inc{position:absolute;inset:0;background:rgba(10,3,8,.66);z-index:50;display:flex;align-items:flex-end;backdrop-filter:blur(3px)}
.inc .sheet{width:100%;border-radius:30px 30px 0 0}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:conic-gradient(var(--pk) var(--p,100%),var(--pk3) 0)}
.ring b{width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.msgs{flex:1;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.35;word-wrap:break-word}
.m.me{align-self:flex-end;background:linear-gradient(135deg,#ff2e93,#ff5fae);color:#fff;border-bottom-right-radius:6px}
.m.th{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.m small{display:block;opacity:.65;margin-top:3px;font-size:11px}
.cin{display:flex;gap:10px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.cin input{flex:1;padding:13px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);outline:0}
.cin button{width:50px;height:50px;border-radius:50%;background:var(--pk);color:#fff;font-size:20px}
.stars{display:flex;justify-content:center;gap:6px;margin:14px 0}.stars button{font-size:40px;filter:grayscale(1);opacity:.4}.stars button.on{filter:none;opacity:1}
#toast{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:center;z-index:99;pointer-events:none}
#toast div{background:#1b0c17;color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:88%;text-align:center;animation:up .2s ease-out;border:1px solid rgba(255,46,147,.5)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat .card{margin:0}.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.tabs{display:flex;gap:8px;margin:0 0 14px}.tabs button{flex:1;padding:11px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:14px}.tabs button.on{background:var(--pk);color:#fff;border-color:var(--pk)}
details.cat{background:var(--card);border:1.5px solid var(--line);border-radius:18px;margin-bottom:10px;padding:0 14px}
details.cat summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 0;font-weight:700;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
.pin-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.pin-row input[type=number]{width:104px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);text-align:right;font-weight:700}
.empty{text-align:center;padding:40px 20px;color:var(--ink2)}.empty .e{font-size:46px}
.err{padding:30px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cfmov{position:absolute;inset:0;z-index:60;background:rgba(10,3,8,.66);display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px);animation:mbin .15s ease-out}
</style>
</head>
<body>
<div id="app">
  <div id="scr" class="scr"></div>
  <div id="mapbox" class="mapbox hide"><canvas id="cv"></canvas><div id="mtop"></div><div id="mfab"></div><div id="panel"></div></div>
  <div id="nav" class="nav hide"></div>
  <div id="ov"></div><div id="chatv"></div><div id="ratev"></div><div id="incv"></div><div id="confirmv"></div>
  <div id="toast"></div>
</div>
<script>
const CATS = [
{k:"limpeza",e:"🧹",n:"Limpeza residencial",o:[["Apto pequeno (1-2 quartos)",90],["Apto médio (3 quartos)",130],["Casa grande (4+ quartos)",180],["Limpeza pesada/pós-festa",160]]},
{k:"diarista",e:"🧼",n:"Diarista",o:[["Diária 4h",100],["Diária 8h",170],["Diária com passar roupa",190]]},
{k:"passadeira",e:"👔",n:"Passadeira de roupa",o:[["Até 10 peças",35],["11 a 25 peças",65],["26 a 50 peças",110]]},
{k:"eletricista",e:"💡",n:"Eletricista",o:[["Troca de tomada/interruptor",70],["Instalação de luminária",90],["Quadro de disjuntores",220],["Visita técnica/diagnóstico",60]]},
{k:"encanador",e:"🔧",n:"Encanador",o:[["Desentupimento simples",90],["Troca de registro/torneira",100],["Vazamento em cano",140],["Instalação de caixa d'água",250]]},

{k:"montador",e:"🪚",n:"Montador de móveis",o:[["Guarda-roupa",150],["Cama box/casal",90],["Cozinha planejada",380],["Estante/rack",80]]},
{k:"chaveiro",e:"🔑",n:"Chaveiro",o:[["Abertura de porta",120],["Cópia de chave simples",25],["Troca de fechadura",160],["Chave codificada de carro",280]]},
{k:"jardinagem",e:"🌿",n:"Jardinagem",o:[["Corte de grama (até 100m²)",90],["Poda de árvores/arbustos",120],["Manutenção mensal",250],["Paisagismo básico",300]]},
{k:"reparos",e:"🛠️",n:"Pequenos reparos",o:[["Marido de aluguel (hora)",70],["Fixar prateleira/quadro",60],["Vedação/silicone banheiro",90],["Ajuste de porta/janela",80]]},

{k:"dedetizacao",e:"🐜",n:"Dedetização",o:[["Apto pequeno",150],["Casa completa",280],["Controle de cupim",320],["Controle de pombos/morcegos",300]]},
{k:"posobra",e:"🧱",n:"Limpeza pós-obra",o:[["Ambiente único",180],["Apto completo",450],["Casa completa",700]]},

{k:"vidros",e:"🪟",n:"Limpeza de vidros",o:[["Até 5 janelas",100],["Fachada/apto alto (com equip.)",220],["Box de banheiro",60]]},

{k:"celular",e:"📱",n:"Manutenção de celular",o:[["Troca de tela",220],["Troca de bateria",130],["Reparo de conector/carga",100]]},
{k:"manicure",e:"💅",n:"Manicure e pedicure",o:[["Mão e pé tradicional",65],["Esmaltação em gel",100],["Spa dos pés",90]]},
{k:"cabelo",e:"💇",n:"Cabeleireiro(a) a domicílio",o:[["Corte feminino",90],["Corte masculino",50],["Escova/prancha",70],["Coloração",180]]},
{k:"maquiagem",e:"💄",n:"Maquiadora",o:[["Maquiagem social",150],["Maquiagem para festa/noiva",320],["Auto-maquiagem (aula)",120]]},
{k:"depilacao",e:"🪒",n:"Depilação",o:[["Perna completa (cera)",90],["Axila",35],["Buço/sobrancelha",30]]},
{k:"massagem",e:"💆",n:"Massagista",o:[["Relaxante (60min)",130],["Modeladora (60min)",150],["Drenagem linfática",140]]},
{k:"personal",e:"🏋️",n:"Personal trainer",o:[["Sessão avaliação",80],["Treino individual (1x)",90],["Pacote 4 sessões",320]]},
{k:"passeador",e:"🐕",n:"Passeador de cães",o:[["Passeio 30min (1 cão)",35],["Passeio 60min (1 cão)",55],["Pacote semanal (5x)",220]]},
{k:"baba",e:"🍼",n:"Babá",o:[["Diária (até 8h)",160],["Período noturno",130],["Meio período (4h)",90]]},
{k:"idosos",e:"🧑‍🦳",n:"Cuidador de idosos",o:[["Diurno (12h)",180],["Noturno (12h)",170],["24h",320]]},
{k:"cozinheiro",e:"👩‍🍳",n:"Cozinheiro(a) para eventos",o:[["Evento até 10 pessoas",250],["Evento 11-30 pessoas",480],["Marmitas semanais (5 dias)",220]]},
{k:"fotografo",e:"📷",n:"Fotógrafo",o:[["Ensaio (1h)",200],["Evento (3h)",450],["Cobertura completa (6h)",800]]},
{k:"mudanca",e:"📦",n:"Mudança e frete",o:[["Frete pequeno (moto/carro)",90],["Mudança kitnet/1 quarto",280],["Mudança 2-3 quartos",550]]},
{k:"guincho",e:"🚛",n:"Guincho",o:[["Reboque até 10km",150],["Reboque 10-30km",280],["Pane seca/troca de pneu",90]]},
{k:"lavagem",e:"🚗",n:"Lavagem de carro",o:[["Lavagem simples",50],["Lavagem completa + cera",100],["Higienização interna",140]]},
{k:"tv",e:"📺",n:"Instalação de TV/painel",o:[["Fixação de TV no suporte",90],["Painel/nicho + TV",220],["Organização de cabos",50]]},
{k:"aulas",e:"📚",n:"Aulas particulares",o:[["Hora aula (reforço)",60],["Pacote 4 aulas",210],["Preparação para provas",80]]}
];
"use strict";
const LS_KEY="chamo_admin_v1";
const PRICE_KEY="chamo_admin_precos";
const state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(s)return s;}catch(e){}
  return {logged:false,nav:"dash",prov:null,taxaPct:10,appNome:"Chamô"};}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
let actx=null;
function beep(freq=880,dur=.12,vol=.05){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);o.stop(actx.currentTime+dur+.02);}catch(e){}}
function sndTap(){beep(700,.05,.03);}
function sndSuccess(){beep(660,.09,.05);setTimeout(()=>beep(880,.14,.05),90);}
function toast(msg){const t=document.getElementById('toast');t.innerHTML=`<div>${msg}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.innerHTML='';},2600);}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function appConfirm(msg,onYes,yesLabel,noLabel){
  const c=document.getElementById('confirmv');if(!c)return;
  c.innerHTML='<div class="cfmov"><div class="card" style="max-width:320px;width:100%;text-align:center">'
    +'<p style="font-weight:700;font-size:16px;margin:6px 0 18px">'+esc(msg)+'</p>'
    +'<div class="acts"><button class="btn ghost sm" id="cfmNo" style="flex:1">'+esc(noLabel||"Cancelar")+'</button>'
    +'<button class="btn sm" id="cfmYes" style="flex:1;background:linear-gradient(135deg,#ff2e93,#ff5fae)">'+esc(yesLabel||"Confirmar")+'</button></div></div></div>';
  document.getElementById('cfmNo').onclick=()=>{c.innerHTML="";};
  document.getElementById('cfmYes').onclick=()=>{c.innerHTML="";onYes();};
}
function fmt(v){return "R$ "+v.toFixed(2).replace(".",",");}
function getPrices(){try{return JSON.parse(localStorage.getItem(PRICE_KEY))||{};}catch(e){return {};}}
function setPrice(catKey,optIdx,val){const p=getPrices();p[catKey+"_"+optIdx]=val;localStorage.setItem(PRICE_KEY,JSON.stringify(p));}
function priceFor(catKey,optIdx,base){const p=getPrices();const k=catKey+"_"+optIdx;return p[k]!=null?p[k]:base;}

function seedProviders(){let pool;try{pool=JSON.parse(localStorage.getItem("chamo_admin_prestadores"));}catch(e){}
  if(pool&&pool.length)return pool;
  const names=["Carlos Silva","Ana Souza","Marcos Lima","Juliana Rocha","Paulo Costa","Fernanda Alves","Roberto Dias","Camila Nunes","Diego Martins","Larissa Prado","Bruno Teixeira","Vanessa Melo"];
  pool=names.map((n,i)=>({id:"p"+i,nome:n,nota:(4.5+Math.random()*0.49).toFixed(1),corridas:80+Math.floor(Math.random()*900),
    status:i%6===0?"pendente":(i===3?"suspenso":(i===7?"bloqueado":"aprovado")),
    docEnviado:Math.random()>0.15,cats:CATS.map(c=>c.k).filter(()=>Math.random()>0.45),ganhos:Math.round(500+Math.random()*4500)}));
  localStorage.setItem("chamo_admin_prestadores",JSON.stringify(pool));return pool;}
function seedClientes(){let pool;try{pool=JSON.parse(localStorage.getItem("chamo_admin_clientes"));}catch(e){}
  if(pool&&pool.length)return pool;
  const names=["Beatriz Fernandes","Rafael Tavares","Sandra Moreira","Igor Barbosa","Vanessa Lopes","Thiago Ramos","Patrícia Gomes","Eduardo Nascimento","Renata Cardoso","André Castro","Marina Freitas","Lucas Pires"];
  pool=names.map((n,i)=>({id:"c"+i,nome:n,pedidos:Math.floor(Math.random()*30),gasto:Math.round(Math.random()*2200),criado:Date.now()-Math.random()*1e10}));
  localStorage.setItem("chamo_admin_clientes",JSON.stringify(pool));return pool;}
function seedPedidos(){let pool;try{pool=JSON.parse(localStorage.getItem("chamo_admin_pedidos"));}catch(e){}
  if(pool&&pool.length)return pool;
  const provs=seedProviders(),clis=seedClientes();pool=[];
  for(let i=0;i<40;i++){const cat=CATS[Math.floor(Math.random()*CATS.length)];const oi=Math.floor(Math.random()*cat.o.length);
    const price=priceFor(cat.k,oi,cat.o[oi][1]);const taxa=Math.max(5,price*(state.taxaPct/100));
    pool.push({id:"PED"+(1000+i),cat,opt:cat.o[oi][0],price,taxa,total:price+taxa,prov:provs[Math.floor(Math.random()*provs.length)],cli:clis[Math.floor(Math.random()*clis.length)],status:["concluído","concluído","concluído","cancelado"][Math.floor(Math.random()*4)],data:Date.now()-Math.floor(Math.random()*20)*86400000});}
  localStorage.setItem("chamo_admin_pedidos",JSON.stringify(pool));return pool;}

function go(nav){sndTap();vib(10);state.nav=nav;save();render();}
function render(){
  document.getElementById('ov').innerHTML="";
  const nav=document.getElementById('nav'),scr=document.getElementById('scr'),map=document.getElementById('mapbox');
  map.classList.add('hide');
  if(!state.logged){nav.classList.add('hide');scr.innerHTML=screenLogin();bindLogin();return;}
  nav.classList.remove('hide');nav.innerHTML=navBar();
  if(state.nav==="dash")scr.innerHTML=screenDash();
  else if(state.nav==="precos")scr.innerHTML=screenPrecos();
  else if(state.nav==="pessoas")scr.innerHTML=screenPessoas();
  else if(state.nav==="config")scr.innerHTML=screenConfig();
  bindScreen();
}
function navBar(){const items=[["dash","📊","Painel"],["precos","🏷️","Preços"],["pessoas","👥","Pessoas"],["config","⚙️","Config"]];
  return items.map(([k,ic,lb])=>`<button data-nav="${k}" class="${state.nav===k?'on':''}"><span>${ic}</span>${lb}</button>`).join("");}

function screenLogin(){
  return `<div class="splash">
  <div class="brand" style="margin-top:14vh"><div class="logo">🛡️</div><h1>Chamô</h1><p>Painel administrativo</p></div>
  <div style="margin-top:26px">
    <label class="field" style="text-align:left"><span style="color:#fff">Usuário</span><input id="fUser" placeholder="admin" style="background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)"></label>
    <label class="field" style="text-align:left"><span style="color:#fff">Senha</span><input id="fPass" type="password" placeholder="••••••" style="background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)"></label>
    <button class="btn" id="btnLogin" style="background:#fff;color:var(--pk);box-shadow:0 10px 26px rgba(0,0,0,.3)">Entrar no painel</button>
    <p style="color:rgba(255,255,255,.7);text-align:center;font-size:12.5px;margin-top:12px">Demonstração: usuário <b>admin</b> senha <b>admin</b></p>
  </div></div>`;
}
function bindLogin(){
  document.getElementById('btnLogin').onclick=()=>{
    const u=document.getElementById('fUser').value.trim(),p=document.getElementById('fPass').value.trim();
    if(u==="admin"&&p==="admin"){sndSuccess();vib([10,30,10]);state.logged=true;save();render();}
    else toast("Usuário ou senha inválidos");
  };
}

function screenDash(){
  const pedidos=seedPedidos();const provs=seedProviders();const clis=seedClientes();
  const ok=pedidos.filter(p=>p.status==="concluído");
  const receita=ok.reduce((s,p)=>s+p.total,0);const lucroTaxa=ok.reduce((s,p)=>s+p.taxa,0);
  const pend=provs.filter(p=>p.status==="pendente").length;
  const porCat={};ok.forEach(p=>{porCat[p.cat.n]=(porCat[p.cat.n]||0)+p.total;});
  const top=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxV=Math.max(1,...top.map(t=>t[1]));
  return `<div class="page"><h2>Painel</h2>
  <div class="stat">
    <div class="card"><small class="mut">Receita total</small><b>${fmt(receita)}</b></div>
    <div class="card"><small class="mut">Taxa da plataforma</small><b>${fmt(lucroTaxa)}</b></div>
    <div class="card"><small class="mut">Pedidos concluídos</small><b>${ok.length}</b></div>
    <div class="card"><small class="mut">Prestadores ativos</small><b>${provs.filter(p=>p.status==='aprovado').length}</b></div>
  </div>
  ${pend?`<div class="card" style="border-color:var(--amb)"><div class="row sp"><span class="pill a">⏳ ${pend} prestador(es) pendente(s) de aprovação</span><button class="btn sm ghost" id="goPend">Ver</button></div></div>`:""}
  <h3 style="margin-top:16px">Receita por categoria</h3>
  ${top.map(([n,v])=>`<div style="margin-bottom:10px"><div class="row sp"><small>${esc(n)}</small><small class="mut">${fmt(v)}</small></div>
    <div style="height:10px;border-radius:8px;background:var(--pk3);overflow:hidden"><div style="height:100%;width:${(v/maxV*100).toFixed(0)}%;background:linear-gradient(90deg,var(--pk),var(--pk2))"></div></div></div>`).join("")}
  <h3 style="margin-top:16px">Clientes cadastrados: ${clis.length}</h3>
  </div>`;
}
function screenPrecos(){
  return `<div class="page"><h2>Categorias &amp; Preços</h2><p class="mut">Toque numa categoria para editar os valores cobrados. Os novos valores passam a valer nos próximos pedidos.</p>
  ${CATS.map(c=>`<details class="cat"><summary><span style="font-size:22px">${c.e}</span><span class="grow">${esc(c.n)}</span><span class="mut">${c.o.length} opções</span></summary>
    <div style="padding-bottom:12px">${c.o.map((o,i)=>`<div class="pin-row"><span class="grow">${esc(o[0])}</span><input type="number" min="0" step="5" data-cat="${c.k}" data-i="${i}" value="${priceFor(c.k,i,o[1])}"></div>`).join("")}
    <button class="btn sm green" data-savecat="${c.k}" style="margin-top:12px;width:100%">Salvar preços de ${esc(c.n)}</button></div></details>`).join("")}
  </div>`;
}
function statusPill(st){const m={pendente:["a","pendente"],aprovado:["g","aprovado"],suspenso:["a","suspenso"],bloqueado:["r","bloqueado"]};const[c,l]=m[st]||["a",st];return `<span class="pill ${c}">${l}</span>`;}
function screenPessoas(){
  const provs=seedProviders();const clis=seedClientes();
  const tab=state.tab||"prov";
  return `<div class="page"><h2>Pessoas</h2>
  <div class="tabs"><button data-t="prov" class="${tab==='prov'?'on':''}">Prestadores (${provs.length})</button><button data-t="cli" class="${tab==='cli'?'on':''}">Clientes (${clis.length})</button></div>
  ${tab==='prov'?provs.map(p=>`<div class="card">
    <div class="row g12">
      <span class="av" style="width:44px;height:44px">${esc(p.nome[0])}</span>
      <div class="grow"><b>${esc(p.nome)}</b><br><small class="mut">⭐ ${p.nota} • ${p.corridas} atendimentos • ${fmt(p.ganhos)}</small></div>
      ${statusPill(p.status)}
    </div>
    <div class="acts" style="flex-wrap:wrap">
      <button class="btn ghost sm" data-doc="${p.id}">📄 ${p.docEnviado?"Ver documento":"Sem documento"}</button>
      ${p.status==='pendente'?`<button class="btn sm green" data-appr="${p.id}">Aprovar</button><button class="btn sm red" data-del="${p.id}">Recusar</button>`:""}
      ${p.status==='aprovado'?`<button class="btn sm ghost" data-susp="${p.id}">Suspender</button><button class="btn sm red" data-block="${p.id}">Bloquear</button>`:""}
      ${p.status==='suspenso'?`<button class="btn sm green" data-appr="${p.id}">Reativar</button><button class="btn sm red" data-block="${p.id}">Bloquear</button>`:""}
      ${p.status==='bloqueado'?`<button class="btn sm green" data-appr="${p.id}">Reativar</button>`:""}
      <button class="btn sm red" data-del="${p.id}">Excluir</button>
    </div>
  </div>`).join(""):clis.map(c=>`<div class="card row g12">
    <span class="av" style="width:44px;height:44px">${esc(c.nome[0])}</span>
    <div class="grow"><b>${esc(c.nome)}</b><br><small class="mut">${c.pedidos} pedidos • ${fmt(c.gasto)} gastos</small></div>
  </div>`).join("")}
  </div>`;
}
function openDocModal(p){
  const ov=document.getElementById('ov');
  ov.innerHTML=`<div class="ov"><div class="ovh"><button class="x" id="ovx">←</button><h3>Documento — ${esc(p.nome)}</h3></div>
  <div class="ovb">
  ${p.docEnviado?`<div class="card" style="text-align:center;padding:34px 16px"><div style="font-size:54px">🪪</div><p><b>Documento de identidade enviado</b></p><p class="mut">Frente do documento, enviado pela galeria no cadastro.</p></div>`
    :`<div class="empty"><div class="e">📄</div>Este prestador ainda não enviou nenhum documento.</div>`}
  <div class="card"><small class="mut">Nome cadastrado</small><br><b>${esc(p.nome)}</b></div>
  </div>
  <div class="ovf">${p.docEnviado?`<button class="btn green" id="btnDocOk">Documento conferido</button>`:`<button class="btn ghost" id="ovClose2">Fechar</button>`}</div></div>`;
  document.getElementById('ovx').onclick=()=>{ov.innerHTML="";};
  const c2=document.getElementById('ovClose2');if(c2)c2.onclick=()=>{ov.innerHTML="";};
  const ok=document.getElementById('btnDocOk');if(ok)ok.onclick=()=>{sndSuccess();toast("Documento marcado como conferido");ov.innerHTML="";};
}
function screenConfig(){
  return `<div class="page"><h2>Configurações</h2>
  <label class="field"><span>Nome do aplicativo</span><input id="cNome" value="${esc(state.appNome)}"></label>
  <label class="field"><span>Taxa da plataforma (%)</span><input id="cTaxa" type="number" min="0" max="50" value="${state.taxaPct}"></label>
  <button class="btn" id="btnSaveCfg">Salvar configurações</button>
  <button class="btn ghost" id="btnResetDemo" style="margin-top:12px">Reiniciar dados de demonstração</button>
  <button class="btn red" id="btnLogout" style="margin-top:12px">Sair do painel</button>
  </div>`;
}
function bindScreen(){
  document.querySelectorAll('#nav [data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
  if(state.nav==="dash"){const gp=document.getElementById('goPend');if(gp)gp.onclick=()=>{state.nav="pessoas";state.tab="prov";save();render();};}
  if(state.nav==="precos"){
    document.querySelectorAll('[data-savecat]').forEach(btn=>btn.onclick=()=>{
      const k=btn.dataset.savecat;document.querySelectorAll(`input[data-cat="${k}"]`).forEach(inp=>{setPrice(k,+inp.dataset.i,+inp.value||0);});
      sndSuccess();vib([10,30,10]);toast("Preços atualizados!");
    });
  }
  if(state.nav==="pessoas"){
    document.querySelectorAll('.tabs [data-t]').forEach(b=>b.onclick=()=>{sndTap();state.tab=b.dataset.t;save();render();});
    const withPool=(id,fn)=>{const pool=seedProviders();const it=pool.find(p=>p.id===id);if(!it)return;fn(it,pool);localStorage.setItem("chamo_admin_prestadores",JSON.stringify(pool));};
    document.querySelectorAll('[data-appr]').forEach(b=>b.onclick=()=>{withPool(b.dataset.appr,it=>it.status="aprovado");sndSuccess();vib(15);toast("Prestador aprovado / reativado");render();});
    document.querySelectorAll('[data-susp]').forEach(b=>b.onclick=()=>{appConfirm("Suspender temporariamente este prestador?",()=>{withPool(b.dataset.susp,it=>it.status="suspenso");vib(15);toast("Prestador suspenso");render();});});
    document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{appConfirm("Bloquear este prestador definitivamente da plataforma?",()=>{withPool(b.dataset.block,it=>it.status="bloqueado");vib(15);toast("Prestador bloqueado");render();});});
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{appConfirm("Excluir esta conta de cadastro? Esta ação não pode ser desfeita.",()=>{const pool=seedProviders().filter(p=>p.id!==b.dataset.del);localStorage.setItem("chamo_admin_prestadores",JSON.stringify(pool));toast("Cadastro excluído");render();},"Excluir");});
    document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{const p=seedProviders().find(x=>x.id===b.dataset.doc);if(p)openDocModal(p);});
  }
  if(state.nav==="config"){
    document.getElementById('btnSaveCfg').onclick=()=>{state.appNome=document.getElementById('cNome').value.trim()||"Chamô";state.taxaPct=+document.getElementById('cTaxa').value||10;save();sndSuccess();toast("Configurações salvas");};
    document.getElementById('btnResetDemo').onclick=()=>{appConfirm("Isso vai apagar todos os dados de demonstração deste painel. Continuar?",()=>{["chamo_admin_prestadores","chamo_admin_clientes","chamo_admin_pedidos",PRICE_KEY].forEach(k=>localStorage.removeItem(k));toast("Dados reiniciados");render();});};
    document.getElementById('btnLogout').onclick=()=>{state.logged=false;save();render();};
  }
}
render();
</script>
</body></html>
